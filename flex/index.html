<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
    <script src="main.js"></script>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-calculator"></i> Calculadora Flex</h1>
        <input class="textview" type="text" readonly />
        <div class="calculadora">
            <button onclick="clean()">C</button>
            <button onclick="back()">←</button>
            <button onclick="insert('/')">/</button>
            <button onclick="insert('*')">×</button>
            <button onclick="insert(7)">7</button>
            <button onclick="insert(8)">8</button>
            <button onclick="insert(9)">9</button>
            <button onclick="insert('-')">−</button>
            <button onclick="insert(4)">4</button>
            <button onclick="insert(5)">5</button>
            <button onclick="insert(6)">6</button>
            <button onclick="insert('+')">+</button>
            <button onclick="insert(1)">1</button>
            <button onclick="insert(2)">2</button>
            <button onclick="insert(3)">3</button>
            <button onclick="equal()" class="equals">=</button>
            <button onclick="insert(0)" class="zero">0</button>
            <button onclick="insert('.')">.</button>
        </div>
    </div>
</body>
</html>
